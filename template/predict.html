<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            width: 100%;
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .spam {
            background-color: #f8d7da;
            color: #721c24;
        }
        .not-spam {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Email Spam Classifier</h1>
        <form id="spam-form" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email_text" class="form-label">Enter the message:</label>
                <textarea class="form-control" id="email_text" name="email_text" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
        <div id="result" class="prediction-result" style="display: none"></div>
    </div>

    <script>
        document.getElementById("spam-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            fetch("", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value,
                },
            })
            .then((response) => response.json())
            .then((data) => {
                const resultDiv = document.getElementById("result");
                resultDiv.style.display = "block";
                resultDiv.className = "prediction-result " + (data.is_spam ? "spam" : "not-spam");
                resultDiv.innerHTML = `<h3>Prediction: ${data.message}</h3>`;
                const inputDiv = document.getElementById("email_text");
                inputDiv.value = "";
            })
            .catch((error) => {
                console.error("Error:", error);
                alert("An error occurred while making the prediction.");
            });
        });
    </script>
</body>
</html>
