<!DOCTYPE html>
<html>
<head>
    <title>Email Spam Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .prediction-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .spam {
            background-color: #f8d7da;
            color: #721c24;
        }
        .not-spam {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Email Spam Classifier</h1>
        
        <form id="spam-form" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email_text" class="form-label">Enter the message:</label>
                <textarea class="form-control" id="email_text" name="email_text" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>

        <div id="result" class="prediction-result" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('spam-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                }
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'prediction-result ' + (data.is_spam ? 'spam' : 'not-spam');
                resultDiv.innerHTML = `<h3>Prediction: ${data.message}</h3>`;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while making the prediction.');
            });
        });
    </script>
</body>
</html>
